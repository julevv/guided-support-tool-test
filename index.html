<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guided Support Tool prototype: understand or prepare a cease-and-desist letter. Education only, not legal advice.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2232%22%20fill%3D%22%230D5B5B%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2C%20Helvetica%2C%20sans-serif%22%20font-size%3D%2232%22%20font-weight%3D%22700%22%20fill%3D%22%23FFFFFF%22%3EG%3C/text%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Guided Support Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: calm guided chat. Top bar with a 4-step progress strip; desktop adds a "Your case" side panel; phone is one column with a fold-out case bar. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --fg:#13292A; --muted:#4E6563; --line:#D3E0DD;
  --brand:#0D5B5B; --brand-fg:#FFFFFF; --brand-soft:#E3EFED; --brand-ink:#0A4747;
  --amber:#B7791F; --amber-bg:#FFF6E0; --amber-ink:#6B4207; --ph:#FCE7B6;
  --crit:#B42318; --crit-bg:#FEF3F2; --crit-ink:#7A1A12; --focus:#E8A33D;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-zh:'Public Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1716; --surface:#13221F; --fg:#E4EFED; --muted:#9DB5B1; --line:#27423E;
  --brand:#5CC4B8; --brand-fg:#06201D; --brand-soft:#173A36; --brand-ink:#BFE9E3;
  --amber:#F2B84B; --amber-bg:#33260B; --amber-ink:#FBE3B3; --ph:#5A4413;
  --crit:#F97066; --crit-bg:#3A1513; --crit-ink:#FDD8D3; --focus:#F2B84B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1716; --surface:#13221F; --fg:#E4EFED; --muted:#9DB5B1; --line:#27423E;
  --brand:#5CC4B8; --brand-fg:#06201D; --brand-soft:#173A36; --brand-ink:#BFE9E3;
  --amber:#F2B84B; --amber-bg:#33260B; --amber-ink:#FBE3B3; --ph:#5A4413;
  --crit:#F97066; --crit-bg:#3A1513; --crit-ink:#FDD8D3; --focus:#F2B84B;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
:root[lang="zh-Hans"] body{font-family:var(--font-zh)}
.app{height:100%;display:flex;flex-direction:column}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar + progress */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar-in{max-width:1180px;margin:0 auto;padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;font-weight:700;font-size:18px;flex-shrink:0}
.av.sm{width:28px;height:28px;font-size:13px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.langsel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 10px;min-height:40px;background:var(--surface)}
.langsel select{border:0;background:transparent;min-height:38px;font-size:14px;cursor:pointer}
.prog{display:flex;flex-direction:column;gap:6px}
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.segs i{height:5px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--brand)}
.prog span{font-size:13px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand-ink);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--brand-soft)}
.btn.primary{background:var(--brand);color:var(--brand-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.wide{width:100%}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn.quiet{border-color:var(--line);color:var(--fg);font-weight:600}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;cursor:pointer;font-size:15px;min-height:32px}

/* layout */
.layout{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;padding-block:20px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}
.chat{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.log{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.composer{border-top:1px solid var(--line);padding:14px 24px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);max-height:62%;overflow-y:auto;flex-shrink:0}
.composer .row{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}
.panel{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.casebar{display:none}

/* messages */
.ra{display:flex;gap:8px;align-items:flex-start;max-width:min(640px,94%)}
.ra .sp{width:28px;flex-shrink:0}
.ra.card-row{max-width:min(680px,100%)}
.ra > .msg, .ra > .card{min-width:0}
.msg{padding:11px 15px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px}
.user{align-self:flex-end;max-width:min(560px,86%);background:var(--brand);color:var(--brand-fg);border-radius:16px 16px 4px 16px}
.user .thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.user .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.5)}
.day{align-self:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.typing{display:flex;gap:5px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}.log{scroll-behavior:auto}}

/* cards */
.card{width:100%;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16.5px;font-weight:700;text-wrap:balance;display:flex;align-items:center;gap:8px}
.card p{margin:0}
.card.soft{background:var(--brand-soft);border-color:transparent}
.card.amber{background:var(--amber-bg);border:1.5px solid var(--amber)}
.card.amber h3{color:var(--amber-ink)}
.card.crit{border:2px solid var(--crit);background:var(--crit-bg)}
.card.crit h3,.crit .eyebrow{color:var(--crit-ink)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.note{font-size:13px;color:var(--muted)}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.facts{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px 16px;margin:0}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0;font-size:15px}
.facts dd .orig{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.facts .hot{color:var(--crit-ink);font-weight:700}
.facts .hotrow{background:var(--crit-bg);border-radius:6px;padding:4px 8px;margin:-4px -8px}
.facts ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field textarea{font-weight:400;font-size:15px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;width:100%}
.field input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px;border:2px dashed var(--brand);border-radius:14px;background:var(--brand-soft);color:var(--brand-ink);cursor:pointer;text-align:center}
.drop.over{filter:brightness(.97)}
.drop b{font-size:16px}
.drop span{font-size:13px}
.thumbrow{display:flex;gap:8px;flex-wrap:wrap}
.thumbrow img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbrow.big img{width:min(180px,44%);height:auto;aspect-ratio:3/2;object-fit:cover}
.thumbph{width:64px;height:64px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.saved{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .t{display:flex;flex-direction:column;min-width:0}
.checks .t b{font-size:15px}
.checks .t span{font-size:13px;color:var(--muted)}
.dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;margin-top:1px}
.dot.done{background:var(--brand)}
.dot.working{border:2.5px solid var(--brand);border-right-color:transparent;animation:spin .8s linear infinite}
.dot.todo{border:2px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dot.working{animation:none;border-right-color:var(--brand)}}
.bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.bar i{height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--brand)}
.finding{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.chip{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1.5px solid}
.chip.diff{color:var(--brand-ink);background:var(--brand-soft);border-color:var(--brand)}
.chip.sim{color:var(--amber-ink);background:var(--amber-bg);border-color:var(--amber)}
.chip.check{color:var(--fg);background:var(--surface);border-color:var(--muted);border-style:dashed}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fgrid div{display:flex;flex-direction:column;gap:2px;font-size:14px}
.fgrid div b,.why b,.ask b{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.why{font-size:14px;display:flex;flex-direction:column;gap:2px}
.ask{font-size:14px;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--brand-soft)}
.ask b{color:var(--brand-ink)}
.fallback{padding:10px 12px;border-radius:10px;border:1.5px dashed var(--amber);background:var(--amber-bg)}
.fallback b{color:var(--amber-ink)}
.att{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.att-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.att-h b{font-size:16px}
.att-h span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.att dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 10px;margin:0;font-size:14px}
.att dt{color:var(--muted)}
.att dd{margin:0}
.sample{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--amber-ink);background:var(--amber-bg);border:1px solid var(--amber);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.gate{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.gate input{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--brand)}
.tbanner{border:1.5px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.tbanner .eyebrow{color:var(--amber-ink)}

/* tone + remedies + draft */
.radio{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.radio .o{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:grid;place-items:center}
.radio.on{border-color:var(--brand);background:var(--brand-soft)}
.radio.on .o{border-color:var(--brand)}
.radio.on .o::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.radio b{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.radio span.d{font-size:13px;color:var(--muted);display:block}
.sugg{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--brand);color:var(--brand-ink);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand-ink);font-weight:700;font-size:14.5px;cursor:pointer}
.chipbtn.on{background:var(--brand);color:var(--brand-fg)}
.locked .radio,.locked .chipbtn{cursor:default;pointer-events:none}
.draft{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);font-size:15px;line-height:1.6;outline:none;display:flex;flex-direction:column;gap:12px}
.draft:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.draft p{margin:0}
.ph{background:var(--ph);color:var(--fg);border-radius:4px;padding:0 3px}
.badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink)}
.sumlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sumlist li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.sumlist li:last-child{border-bottom:0}
.sumlist .tick{margin-left:auto;color:var(--brand)}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--brand-ink);font-weight:600;font-size:15px;text-decoration:none}
.toast{font-size:13px;color:var(--muted)}

/* panel */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h2{margin:0;font-size:15px;font-weight:700}
.dl{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.dl.hot{background:var(--crit-bg);border:2px solid var(--crit)}
.dl.calm{background:var(--brand-soft)}
.dl .big{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.dl.hot .big,.dl.hot .eyebrow{color:var(--crit-ink)}
.dl.calm .big,.dl.calm .eyebrow{color:var(--brand-ink)}
.dl span{font-size:13px}
.kv{display:flex;flex-direction:column;gap:8px;margin:0}
.kv div{display:flex;flex-direction:column}
.kv dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-size:14.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted)}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:700;font-style:normal}
.steps li.done{color:var(--fg)}
.steps li.done i{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.steps li.now{color:var(--fg);font-weight:700}
.steps li.now i{border-color:var(--brand);color:var(--brand-ink)}
.pnote{background:var(--amber-bg);border:1.5px solid var(--amber);border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.pnote b{color:var(--amber-ink)}
.plinks{display:flex;flex-direction:column;gap:6px;font-size:14px}

/* phone */
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:0;gap:0}
  .panel{display:none}
  .chat{border-radius:0;border:0}
  .log,.composer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .log{padding-block:16px}
  .casebar{display:block;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
  .casebar summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;list-style:none}
  .casebar summary::-webkit-details-marker{display:none}
  .casebar summary .chev{margin-left:auto;transition:transform .2s}
  .casebar[open] summary .chev{transform:rotate(180deg)}
  .casebar .inner{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;max-height:55vh;overflow-y:auto}
  .facts{grid-template-columns:1fr;gap:2px}
  .facts dd{margin-bottom:10px}
  .fgrid,.formgrid{grid-template-columns:1fr}
  .composer .row .btn{flex:1 1 auto}
  .ra{max-width:100%}
}
@media (max-width:440px){ .brand span{display:none} .langsel{padding:0 6px} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-in gutter">
      <div class="toprow">
        <div class="av" aria-hidden="true">G</div>
        <div class="brand"><b id="t-name">Guided Support Tool</b><span id="t-sub">Education only, not legal advice</span></div>
        <div class="tools">
          <label class="langsel" for="lang">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9s1.3-6.5 3.8-9z"/></svg>
            <span class="sr" id="t-lang">Language</span>
            <select id="lang">
              <option value="en">English</option>
              <option value="zh">简体中文</option>
              <option disabled>Tiếng Việt (coming soon)</option>
              <option disabled>العربية (coming soon)</option>
              <option disabled>हिन्दी (coming soon)</option>
              <option disabled>Ελληνικά (coming soon)</option>
            </select>
          </label>
          <button type="button" class="btn small quiet" id="restart">Start again</button>
        </div>
      </div>
      <div class="prog" id="prog"></div>
    </div>
  </header>
  <details class="casebar gutter" id="casebar"><summary><span id="cb-title">Your case</span><span id="cb-chip"></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="inner" id="cb-inner"></div></details>

<script>
/* CeDes letter reader: rule-based stand-in for the language model step. */
const TZ = {
  AWST: { off: 8, zone: 'Australia/Perth', en: 'Perth time', zh: '西澳时间' },
  ACST: { off: 9.5, zone: 'Australia/Darwin', en: 'Darwin time', zh: '北领地时间' },
  ACDT: { off: 10.5, zone: 'Australia/Adelaide', en: 'Adelaide time', zh: '南澳时间' },
  AEST: { off: 10, zone: 'Australia/Brisbane', en: 'Brisbane time', zh: '东部标准时间' },
  AEDT: { off: 11, zone: 'Australia/Sydney', en: 'Sydney and Melbourne time', zh: '东部夏令时间' }
};
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const STATES = { 'New South Wales': 'NSW', 'Victoria': 'VIC', 'Queensland': 'QLD', 'Western Australia': 'WA', 'South Australia': 'SA', 'Tasmania': 'TAS', 'Australian Capital Territory': 'ACT', 'Northern Territory': 'NT' };

function parseDeadline(str) {
  if (!str) return null;
  const m = str.match(/(\d{1,2})[.:](\d{2})\s*(am|pm)\s*\(?\s*(A[WCE][SD]T)?\s*\)?[^\d]*?(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/i);
  if (!m) return null;
  let h = +m[1] % 12; if (m[3].toLowerCase() === 'pm') h += 12;
  const mon = MONTHS.indexOf(m[6].toLowerCase());
  if (mon < 0) return null;
  const tz = TZ[(m[4] || 'AEDT').toUpperCase()] ? (m[4] || 'AEDT').toUpperCase() : 'AEDT';
  const ms = Date.UTC(+m[7], mon, +m[5], h, +m[2]) - TZ[tz].off * 3600000;
  return { ms, tz, text: str.trim() };
}

function lev(a, b) {
  a = a.toUpperCase(); b = b.toUpperCase();
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

function parseLetter(raw) {
  const text = raw.replace(/\r/g, '').replace(/[‘’]/g, "'");
  const flat = text.replace(/\s+/g, ' ');
  const paras = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const out = {};
  const firm = flat.match(/\b([A-Z][A-Za-z&' ]*?(?:LAWYERS|Lawyers|LEGAL|Legal|SOLICITORS|Solicitors)(?: PTY LTD| Pty Ltd)?)\b/);
  if (firm) out.sender = firm[1].replace(/\b([A-Z])([A-Z]+)\b/g, (w, a, b) => a + b.toLowerCase()).replace(/\bPty Ltd\b/i, 'Pty Ltd');
  const areasLine = paras.slice(0, 4).find(p => p.includes('|'));
  if (areasLine) out.areas = areasLine.split('|').map(s => s.trim()).filter(Boolean);
  const office = flat.match(/,\s*([A-Z][A-Za-z ]+?)\s+(WA|NSW|VIC|QLD|SA|TAS|ACT|NT)\s+\d{4}/);
  if (office) out.office = office[1].trim() + ' ' + office[2];
  const date = paras.find(p => /^\d{1,2} [A-Z][a-z]+ \d{4}$/.test(p));
  if (date) out.letterDate = date;
  const client = flat.match(/We act for (.+?)\s*\(ACN ([\d ]+)\)/i);
  if (client) { out.client = client[1].trim(); out.acn = client[2].trim(); }
  const base = flat.match(/based in ([A-Z][A-Za-z ]+),\s*(New South Wales|Victoria|Queensland|Western Australia|South Australia|Tasmania|Australian Capital Territory|Northern Territory)/);
  if (base) out.clientBase = base[1].trim() + ' ' + STATES[base[2]];
  const prods = flat.match(/manufacturer and distributor of ([^,]+(?:, [^,]+)*? (?:and )?[^,]+?), based/i);
  if (prods) out.clientProducts = prods[1].trim();
  const reg = flat.match(/Registration No\.?\s*(\d{6,7})\s*(?:for the word mark|\()\s*([A-Z][A-Z]+)/);
  if (reg) { out.number = reg[1]; out.mark = reg[2]; }
  const cls = flat.match(/class (\d{1,2}) in respect of\s*["“]([^"”]+)["”]/i);
  if (cls) { out.cls = cls[1]; out.goods = cls[2].trim(); }
  const sign = flat.match(/using the sign ([A-Z][A-Z]+)/);
  if (sign) out.sign = sign[1];
  const conn = flat.match(/in connection with ([^.]+?)\./i);
  if (conn) out.yourGoods = conn[1].trim();
  out.claimsSubstantially = /substantially identical/i.test(flat);
  out.claimsDeceptively = /deceptively similar/i.test(flat);
  const laws = [];
  const tm = [...flat.matchAll(/section (\d+(?:\(\d+\))?) of (?:the )?(Trade Marks Act 1995|Act)\b/gi)].map(m => m[1]);
  if (tm.length) laws.push({ act: 'tm', secs: [...new Set(tm)] });
  if (/section 18 of the Australian Consumer Law/i.test(flat)) laws.push({ act: 'acl', secs: ['18'] });
  out.laws = laws;
  const iStart = paras.findIndex(p => /requires that you:?$/i.test(p));
  const iEnd = paras.findIndex((p, i) => i > iStart && /^We require/i.test(p));
  if (iStart >= 0 && iEnd > iStart) out.demands = paras.slice(iStart + 1, iEnd).map(s => s.replace(/;\s*(and)?$/, '').replace(/\.$/, ''));
  const dl = flat.match(/by\s+(\d{1,2}[.:]\d{2}\s*[ap]m\s*\([A-Z]{4}\)\s*on\s*[A-Za-z]+,?\s*\d{1,2}\s+[A-Za-z]+\s+\d{4})/i);
  if (dl) out.deadline = parseDeadline(dl[1]);
  const court = flat.match(/proceedings against you in the ([A-Z][A-Za-z ]+?Court(?: of Australia)?)/);
  if (court) out.court = court[1];
  out.threatensCourt = /commence proceedings|legal proceedings|court/i.test(flat);
  out.undertaking = /undertaking/i.test(flat);
  out.ok = !!(out.mark && out.sign);
  if (out.mark && out.sign) out.distance = lev(out.mark, out.sign);
  return out;
}

function remedyPhrase(){
  const r = S.send.rem, copy = S.send.own === 'copy', parts = [];

        formal: 'I am the registered owner of Australian trade mark ' + v('number', 'number') + ' for ' + v('mark', 'Your trade mark') + ', which I have used in my business since ' + v('since', 'year') + '.' };

      P('You may not have known about this, so I wanted to get in touch directly.' + (rp ? ' Would you be willing to ' + rp + '? It would help if you could let me know by ' + date + '.' : ' Could you let me know by ' + date + ' how you’d like to sort it out?')),

      P('Thanks,<br>' + name)].join('');
  }
  if (tone === 'formal'){
    return [P('Dear ' + their + ','),
      P('<b>Re: Use of ' + (copy ? v('work', 'the work') : 'a name similar to ' + v('mark', 'Your trade mark')) + '</b>'),
      P(owns.formal), P(concern.formal),
      P(rp ? 'I request that you ' + rp + ' by ' + date + ', and confirm in writing that you have done so.' : 'I request that you contact me by ' + date + ' to resolve this matter.'),
      P('If you believe I have misunderstood the position, please contact me at ' + email + '.' + (talk ? ' I am open to discussing this.' : '')),
      P('Yours faithfully,<br>' + name + '<br>' + v('yourBiz', 'Your business name'))].join('');
  }
  return [P('Dear ' + their + ','),
    P(copy ? owns.firm + ' ' + concern.firm : concern.firm + ' ' + owns.firm),
    copy ? '' : P('Your name and logo look very similar to mine, so customers may think our businesses are connected.' + shots),

function demandHtml(en){

let lastLen = 0;
function render(){
  document.documentElement.lang = S.lang === 'zh' ? 'zh-Hans' : 'en-AU';
  $('t-name').textContent = t('name'); $('t-sub').textContent = t('sub'); $('t-lang').textContent = t('lang'); $('restart').textContent = t('restart'); $('lang').value = S.lang;
  const L = stageLabels();
  $('prog').innerHTML = '<div class="segs" aria-hidden="true">' + [1,2,3,4].map(i => '<i class="' + (i <= S.stage ? 'on' : '') + '"></i>').join('') + '</div><span>' + esc(t('stageOf', { n: S.stage, l: L[S.stage - 1] })) + '</span>';
  const log = $('log');
  let html = '<div class="day">' + t('today') + '</div>';
  if (S.lang === 'zh') html += '<div class="tbanner" role="note"><span class="eyebrow">' + t('tBannerT') + '</span><span>' + t('tBannerB') + '</span></div>';
  for (let i = 0; i < S.log.length; i++){
    const e = S.log[i];
    if (e.who === 'user'){ html += bubble(e); continue; }
    const prev = S.log[i - 1];
    const first = !prev || prev.who === 'user';
    const isCard = e.who === 'card';
    html += '<div class="ra' + (isCard ? ' card-row' : '') + '">' + (first && !isCard ? '<div class="av sm" aria-hidden="true">G</div>' : '<div class="sp"></div>') + bubble(e) + '</div>';
  }
  if (S.busy) html += '<div class="ra"><div class="av sm" aria-hidden="true">G</div><div class="typing" aria-label="Typing"><i></i><i></i><i></i></div></div>';
  log.innerHTML = html;
  if (S.log.length !== lastLen || S.busy){ log.scrollTop = log.scrollHeight; lastLen = S.log.length; }
  const comp = $('composer');
  const key = S.step + '|' + S.busy + '|' + S.lang + '|' + S.editing;
  if (comp.dataset.key !== key){
    comp.innerHTML = composerHtml() + '<p class="foot">' + t('foot') + '</p>';
    comp.dataset.key = key; wireComposer();
  }
  $('panel').innerHTML = panelFull();
  $('cb-title').textContent = t('caseTitle');
  const n = S.path === 'recv' ? daysLeft() : null;
  $('cb-chip').innerHTML = n == null ? '' : '<span class="chip ' + (n <= 14 ? '' : 'diff') + '" style="' + (n <= 14 ? 'color:var(--crit-ink);background:var(--crit-bg);border-color:var(--crit)' : '') + '">' + esc(n < 0 ? t('passed') : n === 0 ? t('todayDue') : t('replyIn') + ' ' + t('days')(n)) + '</span>';
  $('cb-inner').innerHTML = panelHtml() + '<div class="pnote"><b>' + t('noticeT') + '</b><span>' + t('noticeB') + '</span></div>';
}

/* ---------- summaries ---------- */
function summaryLines(){
  const L = ['Guided Support Tool: case summary', 'General information only, not legal advice.', 'Prepared ' + new Intl.DateTimeFormat('en-AU', { day:'numeric', month:'long', year:'numeric' }).format(new Date()), ''];
  if (S.path === 'send'){
    const s = S.send, f = s.f;
    L.push('MATTER: I am thinking of sending a letter', '');
    L.push('Ownership: ' + (s.own === 'copy' ? 'Own original work (copyright)' : 'Registered trade mark'));
    if (s.own === 'copy'){ if (f.work) L.push('Work: ' + f.work); if (f.made) L.push('Created: ' + f.made); }
    else { if (f.mark) L.push('Trade mark: ' + f.mark); if (f.number) L.push('Registration number: ' + f.number); if (f.since) L.push('Used since: ' + f.since); }
    if (f.yourBiz) L.push('My business: ' + f.yourBiz);
    if (s.theirName) L.push('Other party: ' + s.theirName);
    if (s.where) L.push('Where I saw it: ' + s.where);
    L.push('Evidence: ' + (s.evidence ? s.shots.length + ' screenshot(s)' : 'not yet gathered'));
    if (s.honest != null) L.push('Could be an honest mistake: ' + (s.honest ? 'Yes' : 'No'));
    if (s.complex != null) L.push('Complex or high stakes: ' + (s.complex ? 'Yes' : 'No'));
    const d = latestDraft();
    if (d){ L.push('', 'DRAFT (' + (d.kind === 'nudge' ? 'short friendly message' : STR.en[d.tone === 'friendly' ? 'tFriendly' : d.tone === 'formal' ? 'tFormal' : 'tFirm'] + ' tone') + '). Not sent.', '', draftPlain(d)); }
  } else if (S.data){
    const d = S.data;
    L.push('MATTER: I received a cease-and-desist letter', '');
    if (d.sender) L.push('Sent by: ' + d.sender);
    if (d.client) L.push('On behalf of: ' + d.client + (d.clientBase ? ' (' + d.clientBase + ')' : ''));
    if (d.mark) L.push('Their trade mark: ' + d.mark + (d.number ? ', registration no. ' + d.number : '') + (d.cls ? ', class ' + d.cls + ' (' + d.goods + ')' : ''));
    if (d.sign) L.push('What they object to: ' + d.sign);
    if (d.demands){ L.push('What they want:'); d.demands.forEach(x => L.push(' - ' + x)); }
    if (d.deadline) L.push('Reply by: ' + new Intl.DateTimeFormat('en-AU', { timeZone: TZ[d.deadline.tz].zone, weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'numeric', minute:'2-digit' }).format(new Date(d.deadline.ms)) + ' (' + d.deadline.tz + ')');
    if (S.sells) L.push('Our business sells: ' + S.sells);
    L.push('', 'Questions for a professional:', ' - Are our goods "of the same description" as theirs (s 120(2))? Is their mark well known in Australia (s 120(3))?', ' - Is ' + d.sign + ' substantially identical with ' + d.mark + '? If not, is it deceptively similar?', ' - Are the threats in this letter justified (s 129)?');
  }
  return L;
}
function makePdf(){
  const toast = $('toast');
  try {
    const J = window.jspdf && window.jspdf.jsPDF; if (!J) throw new Error('pdf library not loaded');
    const doc = new J({ unit:'pt', format:'a4' }); const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(); let y = 56;
    doc.setFillColor(13, 91, 91); doc.circle(62, 50, 14, 'F'); doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.text('G', 57.5, 55);
    doc.setTextColor(19, 41, 42); y = 56;
    summaryLines().forEach((line, i) => {
      const bold = i === 0 || /^(MATTER|DRAFT|Questions)/.test(line);
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(i === 0 ? 16 : 11);
      const x = i === 0 ? 86 : 48;
      const wrapped = doc.splitTextToSize(line.replace(/[‘’]/g, "'").replace(/[“”]/g, '"') || ' ', W - x - 48);
      wrapped.forEach(w => { if (y > H - 56){ doc.addPage(); y = 56; } doc.text(w, x, y); y += i === 0 ? 22 : 15; });
      if (i === 0) y += 6;
    });
    doc.save('case-summary.pdf');
    if (toast) toast.textContent = t('pdfMade');
  } catch(e){ if (toast) toast.textContent = t('copySum') + ' ↑'; }
}
async function copyText(txt, btn, label){
  try { await navigator.clipboard.writeText(txt); btn.textContent = label; }
  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); btn.textContent = label; } catch(_){} ta.remove(); }
}

/* ---------- events ---------- */
async function handleFile(file){
  if (!file) return;
  me('uploaded', { name: file.name });
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')){ await say({ k:'pdfMsg' }); S.step = 'upload'; render(); return; }
  try {
    let text = '';
    if (name.endsWith('.pdf')){
      if (!window.pdfjsLib) throw new Error('PDF reader unavailable');
      if (file.size > 15 * 1024 * 1024) throw new Error('PDF file too large');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      try {
        if (pdf.numPages > 50) throw new Error('PDF exceeds 50-page limit');
        const pages = [];
        for (let p = 1; p <= pdf.numPages; p++){
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          pages.push(content.items.map(item => (item.str || '') + (item.hasEOL ? '\\n' : ' ')).join(''));
          page.cleanup();
        }
        text = pages.join('\\n\\n');
      } finally { await pdf.destroy(); }
      if (!text.trim()){ await say({ k:'pdfMsg' }); S.step = 'upload'; render(); return; }
    } else if (name.endsWith('.docx')){
      if (!window.mammoth) throw new Error('reader not loaded');
      text = (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
    } else if (name.endsWith('.txt')) text = await file.text();
    else throw new Error('Unsupported file type');
    processText(text);
  } catch(e){ await say({ k:'readFail' }); S.step = 'upload'; render(); }
}

const readImgs = files =>Promise.all([...files].slice(0, 6).map(f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(null); fr.readAsDataURL(f); }))).then(a => a.filter(Boolean));
function wireComposer(){
  const fi = $('letter-file');
  if (fi){
    fi.addEventListener('change', () => handleFile(fi.files[0]));
    const drop = $('drop');
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) handleFile(f); });
  }
  const of = $('own-form');
  if (of) of.addEventListener('submit', e => {
    e.preventDefault();
    of.querySelectorAll('input').forEach(i => { S.send.f[i.id.replace(/^f-/, '')] = i.value.trim(); });
    me('detailsSaid'); askEvidence();
  });
  const ef = $('ev-form');
  if (ef){
    const shotIn = $('f-shots'), drop = $('shot-drop');
    let pending = null;
    const addFiles = files => { const imgs = [...files].filter(f => /^image\//.test(f.type)); if (!imgs.length) return; pending = readImgs(imgs).then(a => { S.send.shots = S.send.shots.concat(a).slice(0, 6); showShots(); pending = null; }); };
    shotIn.addEventListener('change', () => addFiles(shotIn.files));
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { if (e.dataTransfer) addFiles(e.dataTransfer.files); });
    ef.addEventListener('paste', e => { if (e.clipboardData && e.clipboardData.files.length) addFiles(e.clipboardData.files); });
    showShots();
    ef.addEventListener('submit', async e => {
      e.preventDefault();
      if (pending) await pending;
      S.send.theirName = $('f-their').value.trim(); S.send.where = $('f-where').value.trim(); S.send.evidence = true;
      me('evSaid', null, { photos: S.send.shots });
      await say({ who:'card', kind:'evSaved' }); askHonest();
    });
  }
  const mf = $('manual-form');
  if (mf) mf.addEventListener('submit', e => {
    e.preventDefault();
    const v2 = id => $('m-' + id).value.trim();
    const d = { sender: v2('sender'), client: v2('client'), mark: v2('mark').toUpperCase(), number: v2('number'), sign: v2('sign').toUpperCase(), laws: [], demands: [], ok: true };
    const dd = v2('deadline');
    if (dd){ const [y, m, day] = dd.split('-').map(Number); d.deadline = { ms: Date.UTC(y, m - 1, day, 17, 0) - 11 * 3600000, tz: 'AEDT', text: dd }; }
    d.distance = lev(d.mark, d.sign); S.data = d; me('manualSent'); afterRead();
  });
  const uf = $('use-form');
  if (uf) uf.addEventListener('submit', async e => {
    e.preventDefault();
    S.sells = $('sells').value.trim() || S.sellsDraft || '';
    S.photos = await readImgs($('photos').files || []);
    me('userSells', { x: zh(S.sells), n: S.photos.length }, { photos: S.photos, k2: S.photos.length ? 'userPhotos' : null });
    research();
  });
  const ack = $('ack'); if (ack) ack.addEventListener('change', () => { $('gate-btn').disabled = !ack.checked; });
  const pf = $('pc-form');
  if (pf) pf.addEventListener('submit', e => { e.preventDefault(); const pc = $('pc').value.trim(); if (!/^\d{4}$/.test(pc)){ $('pc-err').hidden = false; $('pc').setAttribute('aria-invalid', 'true'); return; } findAtt(pc); });
}

    case 'gate': showFindings(); break;
    case 'yesFind': me('yesFind'); askPostcode(); break;
    case 'noFind': me('noThanks2'); nextSteps(); break;
    case 'next': me('showNext'); nextSteps(); break;
    case 'copyAtt': { const x = ATTS[+el.dataset.i]; copyText(x.name + ', ' + x.firm + '\n' + x.phone + '\n' + x.email, el, t('copied')); } break;
  }
});
$('restart').addEventListener('click', () => { if (!S.busy) start(); });
$('lang').addEventListener('change', e => { S.lang = e.target.value; try { localStorage.setItem('gst-lang', S.lang); } catch(_){} render(); });
try { const l = localStorage.getItem('gst-lang'); if (l === 'zh' || l === 'en') S.lang = l; } catch(_){}
render();
start();
</script>
</body>
</html>
